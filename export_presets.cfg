html/head_include="<meta name='apple-mobile-web-app-capable' content='yes'>\n<meta name='mobile-web-app-capable' content='yes'>\n<meta name='apple-mobile-web-app-title' content='Stick Drift'>\n<meta name='apple-mobile-web-app-status-bar-style' content='black'>\n<style>html,body{background:#000;overscroll-behavior:none;touch-action:none}</style>\n<script>\nwindow.sdHaptic=(function(){var pending=0;function fire(ms){try{if(navigator.vibrate&&navigator.vibrate(ms))return;var l=document.createElement('label');var i=document.createElement('input');i.type='checkbox';i.setAttribute('switch','');l.style.display='none';l.appendChild(i);document.body.appendChild(l);l.click();l.remove();}catch(e){}}document.addEventListener('touchend',function(){if(pending){var ms=pending;pending=0;fire(ms);}},{capture:true,passive:true});return{request:function(ms){pending=ms||25;}};})();\nif('serviceWorker' in navigator){var sdReloaded=false;navigator.serviceWorker.addEventListener('controllerchange',function(){if(sdReloaded)return;sdReloaded=true;location.reload();});}\n</script>"

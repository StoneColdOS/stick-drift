name: Build APK

# Every push to main builds an Android APK and puts it on the "latest-build" release.
# Download it on the Thor (or any Android): https://github.com/StoneColdOS/stick-drift/releases/tag/latest-build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: 4.7.1

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Godot and export templates
        run: |
          V=$GODOT_VERSION
          wget -q https://github.com/godotengine/godot/releases/download/$V-stable/Godot_v$V-stable_linux.x86_64.zip
          unzip -q Godot_v$V-stable_linux.x86_64.zip
          mv Godot_v$V-stable_linux.x86_64 /usr/local/bin/godot
          wget -q https://github.com/godotengine/godot/releases/download/$V-stable/Godot_v$V-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/$V.stable
          unzip -q Godot_v$V-stable_export_templates.tpz
          mv templates/* ~/.local/share/godot/export_templates/$V.stable/

      - name: Point Godot at the Android SDK and debug key
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          KS="$GITHUB_WORKSPACE/tools/debug.keystore"
          mkdir -p ~/.config/godot
          for f in editor_settings-4.tres editor_settings-4.7.tres; do
            cat > ~/.config/godot/$f <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$SDK"
          export/android/debug_keystore = "$KS"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          done
          # Each build gets a higher version number so it installs over the last one.
          sed -i "s/^version\/code=.*/version\/code=${{ github.run_number }}/" export_presets.cfg
          sed -i "s/^version\/name=.*/version\/name=\"0.1.${{ github.run_number }}\"/" export_presets.cfg

      - name: Export APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/tools/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p export
          godot --headless --import || true
          godot --headless --export-debug "Android" export/stick-drift.apk
          ls -la export/
          test -s export/stick-drift.apk

      - name: Publish to the latest-build release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Build #${{ github.run_number }} from commit ${GITHUB_SHA::7}: $(git log -1 --pretty=%s)"
          if gh release view latest-build >/dev/null 2>&1; then
            gh release upload latest-build export/stick-drift.apk --clobber
            gh release edit latest-build --notes "$NOTES"
          else
            gh release create latest-build export/stick-drift.apk --title "Latest build" --notes "$NOTES" --latest
          fi
